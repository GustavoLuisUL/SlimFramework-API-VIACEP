server {
    listen 80;
    server_name localhost;

    # A raiz do diretório está no diretório 'public'
    root /var/www/html/public;

    # Tente servir 'index.php' ou outros arquivos de índice primeiro
    index index.php index.html index.htm;

    # Redireciona todas as solicitações para o index.php, se o arquivo não for encontrado
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Configuração para tratar arquivos PHP com PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; # Modificado para 'public'
        include fastcgi_params;
    }

    # Negar o acesso a arquivos ocultos
    location ~ /\.ht {
        deny all;
    }
}
